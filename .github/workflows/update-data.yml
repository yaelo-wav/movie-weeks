# Rebuilds the release data and Pathé showtimes every Monday evening, syncs the Letterboxd watchlist and diary
# every morning, and publishes the site to GitHub Pages. Free for public repos.
# Pathé publishes the new week's showtimes on Monday at 18:00 Dutch time.
name: Update releases

on:
  schedule:
    # Mondays 18:00 UTC = 19:00 Dutch winter time, 20:00 summer time (always after Pathé's 18:00 update).
    - cron: '0 18 * * 1'
    # Every day 05:00 UTC: Letterboxd sync only.
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # App changes (pushes) publish right away. Releases and showtimes refresh on Monday or a manual run;
      # Letterboxd syncs on every scheduled or manual run.
      - name: Fetch Dutch release dates and TMDB details
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 18 * * 1'
        run: node scripts/build-data.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Fetch Pathé showtimes
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 18 * * 1'
        run: node scripts/build-showtimes.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Sync Letterboxd watchlist and diary
        if: github.event_name != 'push'
        run: node scripts/build-letterboxd.mjs
        env:
          LETTERBOXD_USER: yaelooo

      # Save the data (and the cached matches) so past weeks and matches carry over between runs.
      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add docs/data cache
          git diff --staged --quiet || (git commit -m "Update release data" && git pull --rebase && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
