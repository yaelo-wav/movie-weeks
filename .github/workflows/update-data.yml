# Rebuilds the release data every 6 hours and publishes the site to GitHub Pages. Free for public repos.
name: Update releases

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Dutch release dates and TMDB details
        run: node scripts/build-data.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      # Save the data (and the Filmvandaag-to-TMDB matches) so past weeks and matches carry over between runs.
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add docs/data cache
          git diff --staged --quiet || (git commit -m "Update release data" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
